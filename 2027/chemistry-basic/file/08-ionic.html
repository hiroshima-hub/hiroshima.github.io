<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>イオンの配列と動き</title>
<link rel="stylesheet" href="lesson-model.css"><link rel="stylesheet" href="bond-model.css"></head>
<body><main><h1>イオンの配列と動き</h1>
<div class="controls" role="group" aria-label="状態の切り替え"><button data-value="solid" aria-pressed="true">結晶</button><button data-value="water" aria-pressed="false">水に溶かす</button><button data-value="melt" aria-pressed="false">融かす</button><button data-value="slip" aria-pressed="false">層をずらす</button><button id="move" disabled>1こま動かす</button></div>
<svg id="diagram" class="model-stage" viewBox="0 0 1000 310" role="img" aria-label="イオンの配列と動き"></svg>
<p id="result" class="model-result" aria-live="polite"></p>
<small class="model-note">NaClの配列の一断面。球の大きさ・間隔は説明用。溶液中でイオンを囲む水分子、電極での反応は省略。</small>
<noscript>この操作モデルを利用するにはJavaScriptを有効にしてください。</noscript>
</main><script src="bond-model.js"></script><script src="08-ionic.js"></script></body></html>
