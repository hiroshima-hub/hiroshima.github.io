<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3分タイマー</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      background: transparent;
      color: #111;
    }
    #time {
      font-size: clamp(80px, 21vw, 140px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #start {
      font: inherit;
      font-size: 24px;
      font-weight: 600;
      padding: 12px 44px;
      color: #fff;
      background: #17634f;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #start:focus-visible { outline: 3px solid #e7ad37; outline-offset: 3px; }
    #start:hover { background: #10513f; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="time" role="timer" aria-label="残り時間">03:00</div>
  <button id="start" type="button">スタート</button>

  <script>
    const DURATION_MS = 3 * 60 * 1000;
    const time = document.getElementById('time');
    const start = document.getElementById('start');
    let intervalId;

    start.addEventListener('click', () => {
      start.hidden = true;
      const endAt = performance.now() + DURATION_MS;

      function update() {
        const seconds = Math.max(0, Math.ceil((endAt - performance.now()) / 1000));
        const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
        const ss = String(seconds % 60).padStart(2, '0');
        time.textContent = `${mm}:${ss}`;
        if (seconds === 0) clearInterval(intervalId);
      }

      update();
      intervalId = setInterval(update, 200);
    }, { once: true });
  </script>
</body>
</html>
