<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>金属の自由電子と層のずれ</title>
<link rel="stylesheet" href="lesson-model.css"><link rel="stylesheet" href="bond-model.css"></head>
<body><main><h1>金属の自由電子と層のずれ</h1>
<div class="controls" role="group" aria-label="金属の状態"><button data-value="rest" aria-pressed="true">電圧なし</button><button data-value="voltage" aria-pressed="false">電圧をかける</button><button data-value="slip" aria-pressed="false">層をずらす</button><button id="move">1こま動かす</button></div>
<svg id="diagram" class="model-stage" viewBox="0 0 1000 310" role="img" aria-label="金属の自由電子と層のずれ"></svg>
<p id="result" class="model-result" aria-live="polite"></p>
<small class="model-note">自由電子は電圧がなくても動いている。電圧をかけると、全体として決まった向きの移動が加わる。球・点の大きさや速さは説明用。 電気をよく通す物質は導体、ほとんど通さない物質は絶縁体。発展：一部の金属などは低温で抵抗が0になる超伝導を示す。</small>
<noscript>この操作モデルを利用するにはJavaScriptを有効にしてください。</noscript>
</main><script src="bond-model.js"></script><script src="12-metal.js"></script></body></html>
