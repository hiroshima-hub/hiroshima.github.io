<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>原子量は、同位体の相対質量の平均</title>
<link rel="stylesheet" href="lesson-model.css"><link rel="stylesheet" href="bond-model.css"><link rel="stylesheet" href="quantity-model.css"></head>
<body><main><h1>原子量は、同位体の相対質量の平均</h1>
<div class="controls"><label for="abundance">¹³Cの割合</label><input id="abundance" type="range" min="0" max="100" step="0.01" value="1.07"><output id="abundance-value" for="abundance"></output><button id="sample">例題の割合</button><button id="half">半分ずつ</button></div>
<svg id="diagram" class="model-stage" viewBox="0 0 1000 310" role="img" aria-label="原子量は、同位体の相対質量の平均"></svg>
<p id="result" class="model-result" aria-live="polite"></p><small class="model-note">例題の存在比は¹²Cが98.93％、¹³Cが1.07％。天然試料の割合には幅がある。¹³Cの相対質量は13.003を使用。</small>
<noscript>この操作教材ではJavaScriptを使用します。</noscript>
</main><script src="bond-model.js"></script><script src="quantity-model.js"></script><script src="14-isotopes.js"></script></body></html>
