<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>分子間にはたらく引力</title>

<body><main><h1>分子間にはたらく引力</h1>
<div class="controls" role="group" aria-label="分子間力の例"><button data-value="dispersion" aria-pressed="true">分散力</button><button data-value="dipole" aria-pressed="false">極性分子どうし</button><button data-value="hydrogen" aria-pressed="false">水素結合</button><button id="change">瞬間を変える</button></div>
<svg id="diagram" class="model-stage" viewBox="0 0 1000 310" role="img" aria-label="分子間にはたらく引力"></svg>
<p id="result" class="model-result" aria-live="polite"></p>
<small class="model-note">電子の偏りや分子の向きを模式化した例。分散力は極性分子にもはたらく。「ファンデルワールス力」は分散力や双極子間の力などを含める用法がある。</small>
