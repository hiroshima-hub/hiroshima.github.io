<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="295" viewBox="0 0 1100 295" role="img" aria-labelledby="title"><title id="title">硫酸銅五水和物と無水物に相当する物質量</title><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="210" y="64" text-anchor="middle" font-size="43" fill="#167967" font-weight="700">CuSO₄·5H₂O</text><text x="210" y="124" text-anchor="middle" font-size="36" fill="#173e37" font-weight="400">1 mol</text><text x="210" y="181" text-anchor="middle" font-size="34" fill="#173e37" font-weight="400">250 g</text><line x1="420" y1="110" x2="500" y2="110" stroke="#167967" stroke-width="4"/><polygon points="500,110 487.39374056706254,116.08951747755722 487.39374056706254,103.91048252244278" fill="#167967"/><text x="655" y="64" text-anchor="middle" font-size="31" fill="#173e37" font-weight="400">CuSO₄の部分</text><text x="655" y="124" text-anchor="middle" font-size="36" fill="#376eae" font-weight="400">1 mol</text><text x="655" y="181" text-anchor="middle" font-size="34" fill="#173e37" font-weight="400">160 g</text><text x="815" y="123" text-anchor="middle" font-size="38" fill="#173e37" font-weight="400">＋</text><text x="965" y="64" text-anchor="middle" font-size="31" fill="#173e37" font-weight="400">結晶水</text><text x="965" y="124" text-anchor="middle" font-size="36" fill="#b64d35" font-weight="400">5 mol</text><text x="965" y="181" text-anchor="middle" font-size="34" fill="#173e37" font-weight="400">90 g</text><text x="550" y="260" text-anchor="middle" font-size="31" fill="#173e37" font-weight="400">水和物1molから、CuSO₄ 1mol分が溶液に入る。</text></g></svg>
