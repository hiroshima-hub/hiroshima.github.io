<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="365" viewBox="0 0 1100 365" role="img" aria-labelledby="title"><title id="title">塩素分子と塩化水素の結合の極性</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="15" y="15" width="520" height="270" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><rect x="555" y="15" width="530" height="270" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="275" y="57" font-size="29" fill="#167967" text-anchor="middle" font-weight="700">Cl₂：偏らない</text><circle cx="190" cy="156" r="43" fill="#d5edce" stroke="#58716b" stroke-width="2"/><text x="190" y="165.1" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">Cl</text><circle cx="360" cy="156" r="43" fill="#d5edce" stroke="#58716b" stroke-width="2"/><text x="360" y="165.1" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">Cl</text><circle cx="275" cy="149" r="4.5" fill="#167967" stroke="none" stroke-width="2"/><circle cx="275" cy="163" r="4.5" fill="#167967" stroke="none" stroke-width="2"/><text x="820" y="57" font-size="29" fill="#167967" text-anchor="middle" font-weight="700">HCl：Cl側へ偏る</text><circle cx="730" cy="156" r="38" fill="#eaf1f3" stroke="#58716b" stroke-width="2"/><text x="730" y="165.1" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">H</text><circle cx="910" cy="156" r="47" fill="#d5edce" stroke="#58716b" stroke-width="2"/><text x="910" y="165.1" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">Cl</text><circle cx="848" cy="149" r="4.5" fill="#b64d35" stroke="none" stroke-width="2"/><circle cx="848" cy="163" r="4.5" fill="#b64d35" stroke="none" stroke-width="2"/><text x="730" y="108" font-size="28" fill="#b64d35" text-anchor="middle" font-weight="400">δ⁺</text><text x="910" y="100" font-size="28" fill="#376eae" text-anchor="middle" font-weight="400">δ⁻</text><line x1="770" y1="225" x2="870" y2="225" stroke="#b64d35" stroke-width="4"/><polygon points="870,225 855.5928463623571,231.95944854577968 855.5928463623571,218.04055145422032" fill="#b64d35"/><text x="820" y="265" font-size="23" fill="#173e37" text-anchor="middle" font-weight="400">電子の偏り</text><text x="550" y="335" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">δは部分的な電荷。電子が完全に移った状態とは区別する。</text></g></svg>
