<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="335" viewBox="0 0 1100 335" role="img" aria-labelledby="title"><title id="title">ダースとmolの比較</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="20" width="510" height="230" rx="12" fill="#eff7f3" stroke="#b7cec4"/><rect x="570" y="20" width="510" height="230" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="275" y="68" text-anchor="middle" font-size="36" fill="#167967" font-weight="700">1ダース</text><text x="825" y="68" text-anchor="middle" font-size="36" fill="#167967" font-weight="700">1 mol</text><circle cx="150" cy="110" r="13" fill="#376eae"/><circle cx="200" cy="110" r="13" fill="#376eae"/><circle cx="250" cy="110" r="13" fill="#376eae"/><circle cx="300" cy="110" r="13" fill="#376eae"/><circle cx="350" cy="110" r="13" fill="#376eae"/><circle cx="400" cy="110" r="13" fill="#376eae"/><circle cx="150" cy="152" r="13" fill="#376eae"/><circle cx="200" cy="152" r="13" fill="#376eae"/><circle cx="250" cy="152" r="13" fill="#376eae"/><circle cx="300" cy="152" r="13" fill="#376eae"/><circle cx="350" cy="152" r="13" fill="#376eae"/><circle cx="400" cy="152" r="13" fill="#376eae"/><text x="275" y="219" text-anchor="middle" font-size="36" fill="#173e37" font-weight="400">12個</text><text x="825" y="139" text-anchor="middle" font-size="36" fill="#173e37" font-weight="400">6.02214076×10²³ 個</text><text x="825" y="207" text-anchor="middle" font-size="26" fill="#173e37" font-weight="400">指定した粒子のまとまり</text><text x="550" y="302" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">原子・分子・イオンなど、何を数えるのかも指定する。</text></g></svg>
