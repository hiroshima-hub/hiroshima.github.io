<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="445" viewBox="0 0 1100 445" role="img" aria-labelledby="title"><title id="title">固体・液体と気体の粒子間隔の比較</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="15" width="510" height="300" rx="12" fill="#eff7f3" stroke="#b7cec4"/><rect x="570" y="15" width="510" height="300" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="275" y="62" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">液体・固体</text><text x="825" y="62" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">気体</text><circle cx="130" cy="123" r="26" fill="#376eae"/><circle cx="187" cy="123" r="26" fill="#376eae"/><circle cx="244" cy="123" r="26" fill="#376eae"/><circle cx="301" cy="123" r="26" fill="#376eae"/><circle cx="358" cy="123" r="26" fill="#376eae"/><circle cx="415" cy="123" r="26" fill="#376eae"/><circle cx="130" cy="180" r="26" fill="#376eae"/><circle cx="187" cy="180" r="26" fill="#376eae"/><circle cx="244" cy="180" r="26" fill="#376eae"/><circle cx="301" cy="180" r="26" fill="#376eae"/><circle cx="358" cy="180" r="26" fill="#376eae"/><circle cx="415" cy="180" r="26" fill="#376eae"/><circle cx="130" cy="237" r="26" fill="#376eae"/><circle cx="187" cy="237" r="26" fill="#376eae"/><circle cx="244" cy="237" r="26" fill="#376eae"/><circle cx="301" cy="237" r="26" fill="#376eae"/><circle cx="358" cy="237" r="26" fill="#376eae"/><circle cx="415" cy="237" r="26" fill="#376eae"/><circle cx="630" cy="105" r="8" fill="#376eae"/><circle cx="840" cy="125" r="8" fill="#376eae"/><circle cx="1030" cy="100" r="8" fill="#376eae"/><circle cx="710" cy="265" r="8" fill="#376eae"/><circle cx="980" cy="260" r="8" fill="#376eae"/><text x="275" y="363" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">粒子が近接する</text><text x="825" y="363" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">粒子間の空間が大きい</text><text x="550" y="415" text-anchor="middle" font-size="24" fill="#58716b" font-weight="400">大きさ・間隔を比べる模式図。実際の縮尺や個数比ではない。</text></g></svg>
