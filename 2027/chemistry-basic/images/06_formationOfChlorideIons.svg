<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">単原子イオン：陰イオン（塩素原子から塩化物イオンへ）</title>
<desc id="svgdesc">電子配置が2、8、7の塩素原子が、電子1個を受け取って電子配置2、8、8の塩化物イオンになる過程を電子殻モデルで示す。</desc>
<defs>
  <style>
    .jp { font-family:"Noto Sans CJK JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    .math { font-family:"Noto Sans CJK JP", "Segoe UI", sans-serif; }
    .title { font-size:54px; font-weight:800; fill:#152b45; }
    .subtitle { font-size:38px; font-weight:750; fill:#145a99; }
    .body { font-size:25px; fill:#30455b; }
    .note { font-size:23px; fill:#45566a; }
    .caption { font-size:26px; font-weight:650; fill:#41556b; }
    .symbol { font-size:47px; font-weight:650; fill:#193b65; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2472b5" />
  </marker>
  <marker id="callout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#506173" />
  </marker>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<rect x="0" y="0" width="1600" height="10" fill="#256ba8"/>
<text x="96" y="100" class="jp title">単原子イオン</text>
<text x="100" y="168" class="jp subtitle">② 陰イオン</text>
<text x="365" y="164" class="jp body">電子を受け取って安定な電子配置になる</text>
<rect x="1085" y="51" width="422" height="134" rx="16" fill="#f3f8fe" stroke="#d7e5f5" stroke-width="2"/>
<text x="1110" y="91" class="jp" fill="#1765a7" font-size="22" font-weight="700">陰イオンになりやすい元素</text>
<text x="1110" y="130" class="jp note">非金属元素が多い</text>
<text x="1110" y="163" class="jp note">価電子：5〜7個</text>
<path d="M 94 207 H 1506" stroke="#dce5ed" stroke-width="2"/>
<text x="362" y="253" text-anchor="middle" class="jp" fill="#de2b2b" font-size="28" font-weight="750">価電子　7個</text>
