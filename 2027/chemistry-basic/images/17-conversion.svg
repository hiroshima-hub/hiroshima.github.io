<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title"><title id="title">質量パーセント濃度からモル濃度への換算</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="10" y="20" width="230" height="200" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="125" y="64" text-anchor="middle" font-size="24" fill="#173e37" font-weight="400">① 溶液の体積</text><text x="125" y="130" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">1 L</text><text x="125" y="191" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">＝1000mL</text><line x1="250" y1="120" x2="280" y2="120" stroke="#167967" stroke-width="4"/><polygon points="280,120 267.39374056706254,126.08951747755722 267.39374056706254,113.91048252244278" fill="#167967"/><rect x="290" y="20" width="230" height="200" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="405" y="64" text-anchor="middle" font-size="24" fill="#173e37" font-weight="400">② 溶液の質量</text><text x="405" y="130" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">1070 g</text><text x="405" y="191" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">×1.07g/mL</text><line x1="530" y1="120" x2="560" y2="120" stroke="#167967" stroke-width="4"/><polygon points="560,120 547.3937405670625,126.08951747755722 547.3937405670625,113.91048252244278" fill="#167967"/><rect x="570" y="20" width="230" height="200" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="685" y="64" text-anchor="middle" font-size="24" fill="#173e37" font-weight="400">③ NaClの質量</text><text x="685" y="130" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">107 g</text><text x="685" y="191" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">×10.0/100</text><line x1="810" y1="120" x2="840" y2="120" stroke="#167967" stroke-width="4"/><polygon points="840,120 827.3937405670625,126.08951747755722 827.3937405670625,113.91048252244278" fill="#167967"/><rect x="850" y="20" width="230" height="200" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="965" y="64" text-anchor="middle" font-size="24" fill="#173e37" font-weight="400">④ NaClの物質量</text><text x="965" y="130" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">1.83 mol</text><text x="965" y="191" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">÷58.5g/mol</text><text x="550" y="288" text-anchor="middle" font-size="29" fill="#173e37" font-weight="400">溶液1Lに1.83mol含まれる → モル濃度1.83mol/L</text></g></svg>
