<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460">
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7f6f3" stop-opacity=".92"/><stop offset=".5" stop-color="#f6ffff" stop-opacity=".55"/><stop offset="1" stop-color="#9bd7d4" stop-opacity=".8"/></linearGradient>
 <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5fbfc"/><stop offset="1" stop-color="#79c6c5"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#315a53" flood-opacity=".13"/></filter>
 <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#36776c"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP',sans-serif">
  <rect x="18" y="20" width="885" height="357" rx="24" fill="#f4fbf9" stroke="#c9e4df" stroke-width="2" />
  <rect x="954" y="20" width="526" height="357" rx="24" fill="#f0f8f6" stroke="#a6d2c8" stroke-width="2"/>
