<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title"><title id="title">溶質と溶媒と溶液の質量</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="30" width="270" height="145" rx="12" fill="#f9e9dc" stroke="#b7cec4"/><text x="155" y="87" text-anchor="middle" font-size="34" fill="#b64d35" font-weight="700">溶質</text><text x="155" y="139" text-anchor="middle" font-size="40" fill="#173e37" font-weight="400">10 g</text><text x="345" y="118" text-anchor="middle" font-size="42" fill="#173e37" font-weight="400">＋</text><rect x="400" y="30" width="270" height="145" rx="12" fill="#e4f0fa" stroke="#b7cec4"/><text x="535" y="87" text-anchor="middle" font-size="34" fill="#376eae" font-weight="700">溶媒</text><text x="535" y="139" text-anchor="middle" font-size="40" fill="#173e37" font-weight="400">90 g</text><line x1="700" y1="105" x2="780" y2="105" stroke="#167967" stroke-width="4"/><polygon points="780,105 767.3937405670625,111.08951747755722 767.3937405670625,98.91048252244278" fill="#167967"/><rect x="810" y="30" width="270" height="145" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="945" y="87" text-anchor="middle" font-size="34" fill="#167967" font-weight="700">溶液</text><text x="945" y="139" text-anchor="middle" font-size="40" fill="#173e37" font-weight="400">100 g</text><text x="550" y="232" text-anchor="middle" font-size="31" fill="#173e37" font-weight="400">溶液の質量 ＝ 溶質の質量 ＋ 溶媒の質量</text></g></svg>
