<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="title"><title id="title">化学反応の量を扱うための準備</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="30" width="300" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="170" y="90" text-anchor="middle" font-size="36" fill="#167967" font-weight="700">構造・性質</text><text x="170" y="145" text-anchor="middle" font-size="21" fill="#173e37" font-weight="400">何からでき、どんな性質か</text><rect x="400" y="30" width="300" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="550" y="90" text-anchor="middle" font-size="36" fill="#167967" font-weight="700">質量・粒子数</text><text x="550" y="145" text-anchor="middle" font-size="21" fill="#173e37" font-weight="400">量れる質量と、見えない個数</text><rect x="780" y="30" width="300" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="930" y="90" text-anchor="middle" font-size="36" fill="#167967" font-weight="700">化学反応</text><text x="930" y="145" text-anchor="middle" font-size="21" fill="#173e37" font-weight="400">何が、どれだけ反応するか</text><line x1="335" y1="105" x2="380" y2="105" stroke="#167967" stroke-width="4"/><polygon points="380,105 367.39374056706254,111.08951747755722 367.39374056706254,98.91048252244278" fill="#167967"/><line x1="715" y1="105" x2="760" y2="105" stroke="#167967" stroke-width="4"/><polygon points="760,105 747.3937405670625,111.08951747755722 747.3937405670625,98.91048252244278" fill="#167967"/></g></svg>
