<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title"><title id="title">総質量から個数を求める</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="25" width="290" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="165" y="80" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">全体の質量</text><text x="165" y="138" text-anchor="middle" font-size="43" fill="#167967" font-weight="400">1000 g</text><text x="365" y="111" text-anchor="middle" font-size="43" fill="#173e37" font-weight="400">÷</text><rect x="420" y="25" width="290" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="565" y="80" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">1個分の質量</text><text x="565" y="138" text-anchor="middle" font-size="43" fill="#376eae" font-weight="400">100 g/個</text><text x="765" y="111" text-anchor="middle" font-size="43" fill="#173e37" font-weight="400">＝</text><rect x="820" y="25" width="260" height="150" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="950" y="80" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">個数</text><text x="950" y="138" text-anchor="middle" font-size="43" fill="#b64d35" font-weight="400">10 個</text><text x="550" y="236" text-anchor="middle" font-size="32" fill="#173e37" font-weight="400">全体の質量 ÷ 1個分の質量 ＝ 個数</text></g></svg>
