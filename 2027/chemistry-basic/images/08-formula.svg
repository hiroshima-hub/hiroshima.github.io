<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title"><title id="title">組成式と名称の三つの手順</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="20" y="20" width="1060" height="125" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="65" y="60" font-size="28" fill="#167967" text-anchor="start" font-weight="700">① 電荷を合わせる</text><text x="365" y="105" font-size="40" fill="#376eae" text-anchor="middle" font-weight="400">Ca²⁺ × 1</text><text x="560" y="105" font-size="34" fill="#173e37" text-anchor="middle" font-weight="400">＋</text><text x="770" y="105" font-size="40" fill="#167967" text-anchor="middle" font-weight="400">Cl⁻ × 2</text><text x="300" y="190" font-size="32" fill="#376eae" text-anchor="middle" font-weight="400">＋2</text><text x="550" y="190" font-size="28" fill="#173e37" text-anchor="middle" font-weight="400">＋</text><text x="790" y="190" font-size="32" fill="#167967" text-anchor="middle" font-weight="400">（−1）× 2</text><text x="1000" y="190" font-size="32" fill="#173e37" text-anchor="middle" font-weight="400">＝ 0</text><rect x="20" y="215" width="510" height="130" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="50" y="258" font-size="26" fill="#167967" text-anchor="start" font-weight="700">② 陽イオン → 陰イオン</text><text x="275" y="316" font-size="50" fill="#173e37" text-anchor="middle" font-weight="400">CaCl₂</text><rect x="550" y="215" width="530" height="130" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="580" y="258" font-size="26" fill="#167967" text-anchor="start" font-weight="700">③ 陰イオン → 陽イオン</text><text x="815" y="311" font-size="36" fill="#173e37" text-anchor="middle" font-weight="400">塩化カルシウム</text><text x="550" y="405" font-size="29" fill="#173e37" text-anchor="middle" font-weight="400">多原子イオンはひとかたまり：Ca(OH)₂　／　NaOH</text><text x="550" y="447" font-size="25" fill="#58716b" text-anchor="middle" font-weight="400">OH⁻ が2個なら括弧を使う。1個なら不要。</text></g></svg>
