<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title"><title id="title">縮合重合の材料と用途</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="15" y="15" width="520" height="470" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><rect x="555" y="15" width="530" height="470" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="275" y="60" font-size="37" fill="#167967" text-anchor="middle" font-weight="700">PET</text><text x="275" y="102" font-size="26" fill="#173e37" text-anchor="middle" font-weight="400">ポリエチレンテレフタラート</text><text x="275" y="150" font-size="28" fill="#173e37" text-anchor="middle" font-weight="400">エチレングリコール</text><text x="275" y="187" font-size="28" fill="#173e37" text-anchor="middle" font-weight="400">＋ テレフタル酸</text><path d="M156 245 h48 v32 l25 28 v100 h-98 v-100 l25 -28 Z" fill="#e1f2f4" stroke="#376eae" stroke-width="3"/><rect x="155" y="237" width="50" height="14" rx="3" fill="#376eae" stroke="#376eae"/><text x="180" y="357" font-size="25" fill="#376eae" text-anchor="middle" font-weight="400">PET</text><path d="M345 255 l-45 30 l25 35 l20 -14 v92 h70 v-92 l20 14 l25 -35 l-45 -30 q-35 35 -70 0 Z" fill="#e3dff1" stroke="#746192" stroke-width="3"/><text x="275" y="454" font-size="27" fill="#173e37" text-anchor="middle" font-weight="400">ボトル・ポリエステル繊維</text><text x="820" y="60" font-size="37" fill="#167967" text-anchor="middle" font-weight="700">ナイロン66</text><text x="820" y="137" font-size="27" fill="#173e37" text-anchor="middle" font-weight="400">ヘキサメチレンジアミン</text><text x="820" y="177" font-size="28" fill="#173e37" text-anchor="middle" font-weight="400">＋ アジピン酸</text><path d="M790 255 l-45 30 l25 35 l20 -14 v92 h70 v-92 l20 14 l25 -35 l-45 -30 q-35 35 -70 0 Z" fill="#e3dff1" stroke="#746192" stroke-width="3"/><text x="820" y="454" font-size="27" fill="#173e37" text-anchor="middle" font-weight="400">衣料・産業用繊維</text><text x="550" y="540" font-size="27" fill="#173e37" text-anchor="middle" font-weight="400">どちらも縮合重合。PETはエステル結合、ナイロン66はアミド結合。</text></g></svg>
