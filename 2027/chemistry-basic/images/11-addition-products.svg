<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title"><title id="title">付加重合の材料と用途</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="15" y="20" width="255" height="455" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="142" y="65" font-size="36" fill="#167967" text-anchor="middle" font-weight="700">PE</text><text x="142" y="111" font-size="23" fill="#173e37" text-anchor="middle" font-weight="400">ポリエチレン</text><text x="142" y="154" font-size="22" fill="#173e37" text-anchor="middle" font-weight="400">原料：エチレン</text><path d="M92 215 h30 v22 h40 v-22 h30 v130 h-100 Z" fill="#cce5db" stroke="#167967" stroke-width="3"/><text x="142" y="310" font-size="26" fill="#167967" text-anchor="middle" font-weight="400">PE</text><text x="142" y="410" font-size="20" fill="#173e37" text-anchor="middle" font-weight="400">ごみ袋・フィルム</text><rect x="290" y="20" width="255" height="455" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="417" y="65" font-size="36" fill="#167967" text-anchor="middle" font-weight="700">PP</text><text x="417" y="111" font-size="23" fill="#173e37" text-anchor="middle" font-weight="400">ポリプロピレン</text><text x="417" y="154" font-size="22" fill="#173e37" text-anchor="middle" font-weight="400">原料：プロペン</text><path d="M377 340 v-90 l65 -35" fill="none" stroke="#376eae" stroke-width="14" stroke-linejoin="round"/><text x="417" y="410" font-size="20" fill="#173e37" text-anchor="middle" font-weight="400">ストロー・食品容器</text><rect x="565" y="20" width="255" height="455" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="692" y="65" font-size="36" fill="#167967" text-anchor="middle" font-weight="700">PS</text><text x="692" y="111" font-size="23" fill="#173e37" text-anchor="middle" font-weight="400">ポリスチレン</text><text x="692" y="154" font-size="22" fill="#173e37" text-anchor="middle" font-weight="400">原料：スチレン</text><path d="M620 240 h144 l-15 95 h-114 Z" fill="#eef0f2" stroke="#58716b" stroke-width="4"/><rect x="644" y="262" width="96" height="48" rx="18" fill="#f8fafb" stroke="#c8dad3"/><text x="692" y="410" font-size="20" fill="#173e37" text-anchor="middle" font-weight="400">発泡食品トレー・緩衝材</text><rect x="840" y="20" width="255" height="455" rx="18" fill="#f2f8f5" stroke="#c8dad3"/><text x="967" y="65" font-size="36" fill="#167967" text-anchor="middle" font-weight="700">PVC</text><text x="967" y="111" font-size="23" fill="#173e37" text-anchor="middle" font-weight="400">ポリ塩化ビニル</text><text x="967" y="154" font-size="22" fill="#173e37" text-anchor="middle" font-weight="400">原料：塩化ビニル</text><rect x="902" y="262" width="130" height="60" rx="8" fill="#c7d7e4" stroke="#376eae"/><ellipse cx="902" cy="292" rx="18" ry="30" fill="#edf4fa" stroke="#376eae" stroke-width="3"/><text x="967" y="410" font-size="20" fill="#173e37" text-anchor="middle" font-weight="400">管・消しゴム</text><text x="550" y="524" font-size="25" fill="#173e37" text-anchor="middle" font-weight="400">材料名・単量体・用途をセットで覚える。製品によって別の材料も使われる。</text></g></svg>
