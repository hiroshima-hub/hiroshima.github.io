<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title"><title id="title">粒子数、物質量、質量の換算図</title><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="30" y="115" width="280" height="110" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="170" y="159" text-anchor="middle" font-size="32" fill="#167967" font-weight="700">粒子数 N</text><text x="170" y="203" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">個数</text><rect x="410" y="115" width="280" height="110" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="550" y="159" text-anchor="middle" font-size="32" fill="#167967" font-weight="700">物質量 n</text><text x="550" y="203" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">mol</text><rect x="790" y="115" width="280" height="110" rx="12" fill="#eff7f3" stroke="#b7cec4"/><text x="930" y="159" text-anchor="middle" font-size="32" fill="#167967" font-weight="700">質量 m</text><text x="930" y="203" text-anchor="middle" font-size="28" fill="#173e37" font-weight="400">g</text><line x1="320" y1="145" x2="400" y2="145" stroke="#167967" stroke-width="4"/><polygon points="400,145 387.39374056706254,151.08951747755722 387.39374056706254,138.91048252244278" fill="#167967"/><text x="360" y="113" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">÷Nₐ</text><line x1="400" y1="200" x2="320" y2="200" stroke="#376eae" stroke-width="4"/><polygon points="320,200 332.60625943293746,193.91048252244278 332.60625943293746,206.08951747755722" fill="#376eae"/><text x="360" y="253" text-anchor="middle" font-size="25" fill="#376eae" font-weight="400">×Nₐ</text><line x1="700" y1="145" x2="780" y2="145" stroke="#167967" stroke-width="4"/><polygon points="780,145 767.3937405670625,151.08951747755722 767.3937405670625,138.91048252244278" fill="#167967"/><text x="740" y="113" text-anchor="middle" font-size="25" fill="#173e37" font-weight="400">×M</text><line x1="780" y1="200" x2="700" y2="200" stroke="#376eae" stroke-width="4"/><polygon points="700,200 712.6062594329375,193.91048252244278 712.6062594329375,206.08951747755722" fill="#376eae"/><text x="740" y="253" text-anchor="middle" font-size="25" fill="#376eae" font-weight="400">÷M</text><text x="550" y="322" text-anchor="middle" font-size="27" fill="#173e37" font-weight="400">Nₐ：アボガドロ定数［mol⁻¹］　　M：モル質量［g/mol］</text></g></svg>
